name: DB Tools für macOS veröffentlichen

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-tools-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Kostenlosen Update-Schlüssel prüfen
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Einmalig das Secret SPARKLE_PRIVATE_KEY einrichten. Kein Apple-Zertifikat erforderlich. Siehe ANLEITUNG.md."
            exit 1
          fi
      - run: npm ci
      - name: Electron-Laufzeit vorbereiten
        run: node node_modules/electron/install.js
      - run: npm test
      - name: Version und Tag abgleichen
        run: node scripts/validate-release.cjs
      - run: npm run icons
      - name: Universelle DMG mit kostenloser Ad-hoc-Signatur erstellen
        run: npm run release
      - name: App und Sparkle-Integration prüfen
        run: |
          codesign --verify --deep --strict --verbose=2 "dist-free/mac-universal/DB Tools.app"
          npx --no-install electron-sparkle doctor --app "dist-free/mac-universal/DB Tools.app"
      - name: Update und Appcast mit eigenem Schlüssel signieren
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: npm run appcast
      - name: Release-Dateien hochladen und veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish.cjs
